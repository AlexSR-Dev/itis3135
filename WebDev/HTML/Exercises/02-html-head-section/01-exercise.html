<!-- 
 Implement the following:
 A developer creates a webpage and wants to:
- Give the document a browser-tab title.
- Set its character encoding.
- Provide a short description for search results.
- Connect an external CSS file.
-->
<!doctype html>
<html lang="en-US">
    <head>
        <meta charset="UTF-8">
        <meta name="description" content="This is a sample webpage created by a developer.">
        <title>Section 2</title>
        <link rel="stylesheet" href="styles.css">
        <script src="script.js" defer></script>
    </head>
    <body>
        <h1>Welcome to Section 2</h1>
    </body>
</html>
