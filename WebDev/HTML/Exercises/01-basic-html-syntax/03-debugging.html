    <p>This should not appear.</p>

</body>

    Problem 1:
    The closing tag of the strong element is incorrect.
    The closing tag should be before the </p> tag.

    Problem 2:
    The second <p> element should include quotes around the title attribute's values.
    It should look like this: <p title="This is my second paragraph">HTML is fun.</p>

    Problem 3:
    The third <p> element contains literal angle brackets which are html syntax.
